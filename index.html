<style>

[data-theme=rustic]{--paper:#f7f1e6;--ink:#3f3a2c;--alt:#e8dfc9;--accent:#7a6b3a;--accent2:#b5a671;--leaf:#7d8b5a;--cover:#5a5438;--cover2:#6d6648;--coverfg:#f7f1e6;--seal:#7a6b3a;--muted:#6f6a55;--btn:#5a5438;--btnfg:#fff;--serif:'Fraunces',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
[data-theme=noir]{--paper:#ffffff;--ink:#111827;--alt:#f1f3f6;--accent:#0b6bcb;--accent2:#8fb8e8;--cover:#0b1220;--cover2:#141c2f;--coverfg:#ffffff;--seal:#0b6bcb;--muted:#5b6473;--btn:#111827;--btnfg:#fff;--serif:'DM Serif Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}

[data-theme=rosegold]{--paper:#fff8f6;--ink:#4a3532;--alt:#f7e3df;--accent:#c98f84;--accent2:#e8c4bb;--leaf:#a9b79e;--cover:#f2d7d1;--cover2:#fbebe7;--coverfg:#4a3532;--seal:#c98f84;--muted:#86706b;--btn:#c98f84;--btnfg:#fff}
[data-theme=sky]{--paper:#f7fbff;--ink:#2c4057;--alt:#e3f0fa;--accent:#7fa6cc;--accent2:#cfe2f3;--cover:#dcebf7;--cover2:#f1f7fc;--coverfg:#2c4057;--seal:#7fa6cc;--muted:#647a90;--btn:#7fa6cc;--btnfg:#fff}
[data-theme=fairytale]{--paper:#fffaf0;--ink:#44334f;--alt:#f5e8f5;--accent:#b58ad3;--accent2:#e9c7d8;--cover:#342447;--cover2:#51385f;--coverfg:#fff6e9;--seal:#c99bdc;--muted:#75647d;--btn:#67447e;--btnfg:#fff;--serif:'Playfair Display',Georgia,serif}
[data-theme=elegant]{--paper:#fffdf8;--ink:#34302d;--alt:#f3eee5;--accent:#b49a68;--accent2:#e3d4b4;--cover:#292724;--cover2:#403a32;--coverfg:#fffdf8;--seal:#b49a68;--muted:#777066;--btn:#292724;--btnfg:#fff;--serif:'Cormorant Garamond',Georgia,serif}
[data-theme=passport]{--paper:#f8f5eb;--ink:#263a35;--alt:#e8eee6;--accent:#b48b52;--accent2:#d9c7a4;--cover:#183b35;--cover2:#28534a;--coverfg:#f7ecd2;--seal:#c6a15e;--muted:#66756c;--btn:#183b35;--btnfg:#fff;--serif:'DM Serif Display',Georgia,serif}
[data-theme=storybook]{--paper:#fff9ed;--ink:#47352a;--alt:#f3e5c9;--accent:#b77b42;--accent2:#dfc18a;--cover:#4a2f28;--cover2:#68453a;--coverfg:#fff3d7;--seal:#c49a50;--muted:#786451;--btn:#68453a;--btnfg:#fff;--serif:'Fraunces',Georgia,serif}
[data-theme=dino]{--paper:#f8ffed;--ink:#263f36;--alt:#e3f2cf;--accent:#e58a3a;--accent2:#a9c96b;--cover:#244b3b;--cover2:#386b4d;--coverfg:#fff9dc;--seal:#e58a3a;--muted:#5b755d;--btn:#386b4d;--btnfg:#fff;--serif:'Fredoka',system-ui,sans-serif;--sans:'Nunito',system-ui,sans-serif}
[data-theme=collegiate]{--paper:#fbfaf6;--ink:#1b2a4e;--alt:#e9ecf4;--accent:#b8902f;--accent2:#e0c77f;--cover:#1b2a4e;--cover2:#26396a;--coverfg:#fbfaf6;--seal:#b8902f;--muted:#5a6480;--btn:#1b2a4e;--btnfg:#fff;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);font-weight:300;color:var(--ink);background:var(--paper);line-height:1.7;overflow-x:hidden}
body.locked{overflow:hidden}
h1,h2{font-family:var(--disp,var(--serif));font-weight:400}
html[data-font=script] h1{font-size:clamp(3.6rem,16vw,6.6rem)!important}
html[data-font=script] h2{font-size:2.6rem!important}
section{padding:84px 24px;text-align:center;position:relative}
.wrap{max-width:560px;margin:0 auto;position:relative;z-index:2}
h2{font-size:2.1rem;margin-bottom:26px}
h2:after{content:"";display:block;width:56px;height:1px;background:var(--accent);margin:14px auto 0}
p{margin-bottom:12px}
.alt-bg{background:var(--alt)}
/* cover */
#cover{position:fixed;inset:0;z-index:50;background:var(--cover);color:var(--coverfg);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity 1s;overflow:hidden}
#cover.gone{opacity:0;pointer-events:none}
#cover.doorsmode{background:none;padding:0;display:block}
.door{position:absolute;top:0;bottom:0;width:50%;background:var(--cover);transition:transform 1.4s cubic-bezier(.7,0,.2,1)}
.door.l{left:0}.door.r{right:0;background:var(--cover2)}
.curtain .door{background:repeating-linear-gradient(90deg,var(--seal) 0 26px,color-mix(in srgb,var(--seal) 70%,#000) 26px 52px)}
.open .door.l{transform:translateX(-100%)}.open .door.r{transform:translateX(100%)}
.center{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;transition:opacity .5s}
.open .center{opacity:0}
.for{font-family:var(--serif);font-style:italic;font-size:1.35rem;margin-bottom:26px}
.tap{margin-top:22px;font-size:.95rem;letter-spacing:.04em;opacity:.8}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.cbtn{background:none;border:0;cursor:pointer;color:inherit;font:inherit}
.cbtn:focus-visible{outline:3px solid var(--accent);outline-offset:6px}
.cracked{animation:crack .5s forwards!important}
@keyframes crack{to{transform:scale(1.25) rotate(14deg);opacity:0}}
.openbtn{padding:14px 30px;border:1px solid var(--coverfg);border-radius:2px;font-size:1.05rem}
.gift{position:relative;width:170px;height:170px;margin-top:10px}
.gift .bx{position:absolute;bottom:0;left:10px;right:10px;height:110px;background:var(--seal);border-radius:4px}
.gift .bx:after,.gift .lid:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:22px;margin-left:-11px;background:var(--accent)}
.gift .lid{position:absolute;top:22px;left:0;right:0;height:46px;background:color-mix(in srgb,var(--seal) 85%,#fff);border-radius:4px;transition:transform .9s cubic-bezier(.3,1.6,.5,1),opacity .9s}
.gift.pop .lid{transform:translateY(-130px) rotate(-22deg);opacity:0}
.sc{position:relative;width:300px;height:180px;border-radius:8px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.sc .under{position:absolute;inset:0;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.sc .under b{font:400 1.7rem var(--serif)}
.sc canvas{position:absolute;inset:0;touch-action:none;transition:opacity .8s;cursor:crosshair}
.bl{position:relative;width:150px;height:190px;animation:bob 3s ease-in-out infinite}
.bl i{position:absolute;inset:0 0 28px;border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 35% 30%,#fff8 0,transparent 30%),var(--seal);transition:transform .25s,opacity .25s}
.bl:after{content:"";position:absolute;left:50%;bottom:0;width:2px;height:40px;background:var(--coverfg);opacity:.6}
.bl.pop i{transform:scale(1.5);opacity:0}.bl.pop:after{opacity:0}
@keyframes bob{50%{transform:translateY(-14px)}}
.pz{width:230px;padding:14px 14px 56px;background:#fff;color:#333;box-shadow:0 10px 30px rgba(0,0,0,.3);transform:rotate(-3deg);transition:transform 1s .1s,opacity 1s}
.pz .ph{height:200px;background:var(--pic,linear-gradient(135deg,var(--accent),var(--seal))) center/cover;filter:brightness(0) blur(8px);transition:filter 2.4s}
.pz.dev .ph{filter:none}
.pz p{font:italic 1.2rem var(--serif);margin:14px 0 0;color:#333}
.pz.away{transform:translateY(-120vh) rotate(8deg);opacity:0}
.env{position:relative;width:270px;height:180px;background:color-mix(in srgb,var(--seal) 88%,#000);border-radius:4px;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.env .flap{position:absolute;top:0;left:0;width:100%;height:105px;background:var(--seal);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s;z-index:3}
.env .front{position:absolute;inset:0;background:color-mix(in srgb,var(--seal) 80%,#fff);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);z-index:2}
.env .letter{position:absolute;left:14px;right:14px;top:12px;bottom:12px;background:#fff;color:#333;z-index:1;transition:transform .9s .6s;display:flex;align-items:center;justify-content:center;font:400 1.4rem var(--serif);text-align:center;padding:8px}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env.open .letter{transform:translateY(-95px)}
.bk{position:relative;width:210px;height:280px;perspective:900px;margin:10px auto}
.bk .pg,.bk .cv{position:absolute;inset:0;border-radius:2px 8px 8px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.bk .pg{background:var(--paper);color:var(--ink)}.bk .pg b,.bk .cv b{font:400 1.7rem/1.2 var(--serif)}
.bk .cv{background:var(--seal);color:#fff;transform-origin:left;transition:transform 1.5s cubic-bezier(.6,0,.3,1);backface-visibility:hidden;border-left:8px solid color-mix(in srgb,var(--seal) 70%,#000)}
.bk.open .cv{transform:rotateY(-172deg)}
.bar{position:absolute;left:0;right:0;height:0;background:#000;transition:height 1.2s;z-index:3}
.bar.t{top:0}.bar.b{bottom:0}.cin-on .bar{height:14vh}
.cin p,.cin h1{opacity:0;animation:fin 1.2s forwards;animation-delay:var(--d)}
.cin h1{font-size:clamp(2.6rem,10vw,4.6rem);margin:12px 0}
@keyframes fin{to{opacity:1}}
.passport-card{width:min(86vw,330px);min-height:430px;margin:auto;padding:24px 22px;border:2px solid var(--accent);border-radius:12px;background:linear-gradient(145deg,var(--cover2),var(--cover));color:var(--coverfg);box-shadow:0 18px 48px #0005;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transform:rotate(-2deg);}
.passport-card:before{content:"";position:absolute;inset:9px;border:1px solid color-mix(in srgb,var(--accent) 70%,transparent);border-radius:7px;pointer-events:none}
.passport-emblem{font-size:2.8rem;color:var(--accent2);line-height:1}.passport-label{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase}.passport-names{font:400 2rem/1.15 var(--serif);text-align:center;max-width:260px}.passport-stamp{border:2px dashed var(--accent2);border-radius:50%;padding:14px 10px;transform:rotate(-12deg);font-size:.7rem;letter-spacing:.12em;text-align:center;margin-top:8px}.passport-card.opening{animation:passportOpen 1.4s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes passportOpen{to{transform:translateY(-25px) rotate(0) scale(1.06);opacity:0}}
/* page */
#hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(var(--alt),var(--paper));overflow:hidden}
#hero.hasphoto{background:linear-gradient(var(--ov,rgba(20,25,35,.5)),var(--ov,rgba(20,25,35,.5))),var(--pic) center/cover;color:#fff}
#hero.hasphoto .small,#hero.hasphoto .date{color:#fff}
#hero .small{color:var(--muted);letter-spacing:.03em}
#hero h1{font-size:clamp(3rem,13vw,5.5rem);line-height:1.05;margin:18px 0}
#hero .amp{display:block;font-style:italic;color:var(--accent);font-size:.5em;margin:4px 0}
#hero.hasphoto .amp{color:#fff}
#hero .date{font:1.5rem var(--serif);margin-top:18px}
#hero .date:before{content:"";display:block;width:56px;height:1px;background:var(--accent);margin:0 auto 18px}
.decor{position:absolute;pointer-events:none;z-index:1;width:min(54vw,260px)}
.decor svg{width:100%;height:auto;display:block}
.decor.tl{top:-6px;left:-6px}.decor.br{bottom:-6px;right:-6px;transform:rotate(180deg)}
.arch{position:absolute;left:50%;bottom:0;width:min(88vw,440px);height:86%;transform:translateX(-50%);border:1.5px solid var(--accent);border-bottom:0;border-radius:999px 999px 0 0;pointer-events:none;z-index:1}
.arch:before{content:"";position:absolute;inset:10px;border:1px solid var(--accent2);border-bottom:0;border-radius:999px 999px 0 0}
.frame{position:absolute;inset:18px;border:1px solid var(--accent);pointer-events:none;z-index:1}
.frame:before{content:"";position:absolute;inset:7px;border:1px solid var(--accent2)}
.conf{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.conf i{position:absolute;display:block;opacity:.75;font-style:normal;color:var(--accent);line-height:1}
.faq{text-align:left;max-width:520px;margin:0 auto}
.faq details{border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent);padding:14px 0}
.faq summary{cursor:pointer;font:1.2rem var(--serif);list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";color:var(--accent)}.faq details[open] summary::after{content:"–"}
.faq summary::-webkit-details-marker{display:none}
.faq p{margin:10px 0 0;color:var(--muted)}
.hash{font:1.3rem var(--serif);color:var(--accent);margin-bottom:12px}

.seal2{position:relative;width:150px;height:150px;filter:drop-shadow(0 10px 12px rgba(0,0,0,.45))}
.seal2 span{position:absolute;inset:0;display:block}.seal2 svg{position:absolute;inset:0}
.seal2 .hl{clip-path:polygon(0 0,52% 0,46% 20%,54% 40%,45% 60%,53% 80%,48% 100%,0 100%)}
.seal2 .hr{clip-path:polygon(52% 0,100% 0,100% 100%,48% 100%,53% 80%,45% 60%,54% 40%,46% 20%)}
.seal2.snap .hl{transform:translateX(-40px) rotate(-18deg);opacity:0;transition:transform .8s ease-in,opacity .8s}
.seal2.snap .hr{transform:translateX(40px) rotate(18deg);opacity:0;transition:transform .8s ease-in,opacity .8s}
.eseal{position:absolute;left:50%;top:74px;width:58px;margin-left:-29px;z-index:5;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));transition:transform .5s,opacity .5s}
.env.open .eseal{opacity:0;transform:translateY(12px) rotate(14deg)}
.spot{position:absolute;inset:0;touch-action:none;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.spm{position:absolute;inset:0;background:radial-gradient(circle 120px at var(--x,50%) var(--y,50%),transparent 0,rgba(5,6,10,.97) 100%);pointer-events:none}
.sph{position:absolute;bottom:9vh;left:0;right:0;margin:0}
.lk svg{display:block}.lk #sh{transition:transform .6s;transform-origin:88px 66px}
.lk.open #sh{transform:rotate(-38deg) translateY(-8px)}
.lk.open svg{animation:drop 1s .8s ease-in forwards}
@keyframes drop{to{transform:translateY(110vh) rotate(18deg)}}
.fl{position:relative;width:170px;height:170px}
.fl i{position:absolute;left:50%;top:50%;width:42px;height:80px;margin:-80px 0 0 -21px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:linear-gradient(var(--accent2),var(--accent));transform-origin:50% 100%;transform:rotate(var(--r)) scale(.92);transition:transform 1.1s cubic-bezier(.3,.8,.3,1),opacity 1.1s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.fl b{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:#f2d28b;color:#7a5a12;display:flex;align-items:center;justify-content:center;font:400 1.2rem var(--serif);z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.fl.bloom i{transform:rotate(calc(var(--r) + 22deg)) translateY(-70px) scale(1.35);opacity:0}
/* RSVP */
.rsvp{background:var(--paper);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:16px;padding:30px 24px;box-shadow:0 12px 36px rgba(0,0,0,.08);text-align:left}
.field{margin-bottom:18px}
.lab,.rsvp label{display:block;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 7px;font-weight:500}
.rsvp input,.rsvp select,.rsvp textarea{border-radius:8px;padding:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg .opt{margin:0;position:relative;text-transform:none;letter-spacing:0;font-size:1rem;color:var(--ink)}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:block;text-align:center;padding:15px 10px;border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);border-radius:10px;cursor:pointer;transition:.2s}
.seg input:checked+span{background:var(--accent);color:var(--btnfg);border-color:var(--accent)}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.step{display:flex;align-items:center;gap:14px}
.step button{width:44px;height:44px;border-radius:50%;border:1px solid var(--accent);background:transparent;color:var(--ink);font-size:1.4rem;cursor:pointer}
.step output{font:1.7rem var(--serif);min-width:34px;text-align:center}
.step small{color:var(--muted);margin-left:6px}
.pr{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.pr .pi{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--btnfg);font-size:.8rem;display:flex;align-items:center;justify-content:center}
.pr .who{flex:1;min-width:0;padding:12px;border:1px dashed color-mix(in srgb,var(--ink) 25%,transparent);border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr input{flex:1;min-width:0}.pr select{flex:1;min-width:0}
.badge{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:10px;padding:12px 14px;margin-bottom:18px;font-size:.95rem}
.err{color:#b3261e;min-height:1.3em;margin-bottom:8px;font-size:.95rem}
.btn.big{width:100%;padding:15px;font-size:1.05rem;margin:6px 0 0}
.btn[disabled]{opacity:.6;cursor:wait}
#thanks{display:none;padding:34px 24px;background:var(--paper);border:1px solid var(--accent);border-radius:16px;text-align:center;box-shadow:0 12px 36px rgba(0,0,0,.08)}
#thanks h3{font:400 1.8rem var(--serif);margin-bottom:8px}
#thanks .sum{margin:16px auto;max-width:380px;text-align:left;border-top:1px solid color-mix(in srgb,var(--ink) 15%,transparent)}
#thanks .sum div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 15%,transparent)}
#thanks .sum span{color:var(--muted)}
body.anim:not(.ready) #hero .wrap>*{opacity:0}
body.ready #hero .wrap>*{animation:rise 1.1s both;animation-delay:calc(var(--i)*.16s)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
body.anim .rv{opacity:0;transform:translateY(30px);transition:opacity .9s,transform .9s}
body.anim .rv.in{opacity:1;transform:none}
#count{display:flex;justify-content:center;gap:14px}
#count div{min-width:72px;padding:16px 8px;border:1px solid var(--accent);border-radius:4px}
#count b{display:block;font:400 2rem/1 var(--serif)}
#count span{font-size:.85rem;color:var(--muted)}
.btn{display:inline-block;margin:6px;padding:13px 28px;border:1px solid var(--btn);background:var(--btn);color:var(--btnfg);font:400 1rem var(--sans);border-radius:2px;text-decoration:none;cursor:pointer;letter-spacing:.02em}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.when dt{font:1.4rem var(--serif)}
.when dd{margin:0 0 20px;color:var(--muted)}
.tline{list-style:none;padding:0;text-align:left;position:relative;margin:0 auto;max-width:440px}
.tline:before{content:"";position:absolute;left:107px;top:20px;bottom:20px;width:1px;background:var(--accent)}
.tline li{display:flex;gap:14px;margin-bottom:22px;position:relative;align-items:flex-start}
.tline time{width:74px;text-align:right;font:1.1rem var(--serif);color:var(--accent);flex:none;padding-top:7px}
.tline .ic{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--accent);background:var(--paper);color:var(--accent);display:flex;align-items:center;justify-content:center;position:relative;z-index:1}.tline .tx{padding-top:5px}
.tline b{font:400 1.25rem var(--serif);display:block}.tline span{color:var(--muted);font-size:.95rem}
.sw{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;margin-top:20px}
.sw div{width:84px}.sw i{display:block;width:64px;height:64px;border-radius:50%;margin:0 auto 8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 4px 10px rgba(0,0,0,.1)}
.sw span{font-size:.9rem;color:var(--muted)}
#galwrap{max-width:900px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.grid img{width:100%;aspect-ratio:3/4;object-fit:cover}
.mas{columns:2 160px;column-gap:8px}.mas img{width:100%;margin-bottom:8px;display:block}
.gal img{border-radius:2px;cursor:zoom-in;transition:transform .4s}.gal img:hover{transform:scale(1.02)}
.car{position:relative}
.trk{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px}
.trk::-webkit-scrollbar{display:none}
.trk img{flex:0 0 78%;max-width:420px;aspect-ratio:3/4;object-fit:cover;scroll-snap-align:center}
.car .nav{position:absolute;top:50%;width:42px;height:42px;margin-top:-21px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#222;font-size:1.3rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.car .nav.p{left:4px}.car .nav.n{right:4px}
#lb{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:88vh;object-fit:contain;animation:fin .3s}
#lb button{position:absolute;background:none;border:0;color:#fff;font-size:2.4rem;cursor:pointer;padding:12px}
#lb .x{top:6px;right:10px}#lb .p{left:6px;top:50%}#lb .n{right:6px;top:50%}
form{text-align:left}
label{display:block;margin:16px 0 6px;font-weight:400}
input,select,textarea{width:100%;padding:11px;border:1px solid #c9ced6;border-radius:2px;font:300 1rem var(--sans);background:#fff;color:#1f2a3a}
.row{display:flex;gap:10px}.row label{flex:1;display:flex;gap:8px;align-items:center;margin:8px 0;font-weight:300}
.row input{width:auto}
#thanks{display:none;padding:28px;background:var(--paper);border:1px solid var(--accent);text-align:center}
footer{padding:36px 24px;text-align:center;font-size:.85rem;color:var(--muted)}
#mus{position:fixed;right:14px;bottom:14px;z-index:40;width:44px;height:44px;border-radius:50%;border:1px solid var(--accent);background:var(--paper);color:var(--ink);font-size:1.1rem;cursor:pointer;display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}body .rv,body #hero .wrap>*{opacity:1!important;transform:none!important}}

  lock(c) {
    const A = esc((C.partner1[0] || '').toUpperCase()) + (C.partner2 ? '&amp;' + esc(C.partner2[0].toUpperCase()) : '');
    c.innerHTML = `<div><p class="for">${FOR}</p><button class="cbtn" id="b" aria-label="Unlock the invitation"><div class="lk pulse" id="g"><svg width="160" viewBox="0 0 120 140" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0d68a"/><stop offset=".5" stop-color="#c9a24a"/><stop offset="1" stop-color="#8f6a1f"/></linearGradient></defs><path id="sh" d="M32 66V44a28 28 0 0 1 56 0v22" fill="none" stroke="#c9b06a" stroke-width="10" stroke-linecap="round"/><rect x="16" y="64" width="88" height="68" rx="12" fill="url(#lg)"/><rect x="16" y="64" width="88" height="68" rx="12" fill="none" stroke="#fff" stroke-opacity=".35"/><text x="60" y="106" text-anchor="middle" font-family="Great Vibes,Cormorant Garamond,serif" font-size="34" fill="#5e4210">${A}</text></svg></div></button><p class="tap">Tap the lock to unlock</p></div>`;
    $('b').onclick = () => { $('g').classList.remove('pulse'); $('g').classList.add('open'); setTimeout(go, 1700); };
  },
  flower(c) {
    c.innerHTML = `<div><p class="for">${FOR}</p><button class="cbtn" id="b" aria-label="Open the flower"><div class="fl pulse" id="g">${Array.from({ length: 10 }, (_, i) => `<i style="--r:${i * 36}deg"></i>`).join('')}<b>${esc(mono)}</b></div></button><p class="tap">Tap the flower to bloom</p></div>`;
    $('b').onclick = () => { $('g').classList.remove('pulse'); $('g').classList.add('bloom'); setTimeout(go, 1500); };
  },

  envelope(c) {
    c.innerHTML = `<div><p class="for">${FOR}</p><button class="cbtn" id="b" aria-label="Open the envelope"><div class="env pulse" id="g"><div class="letter">${esc(heading)}</div><div class="flap"></div><div class="front"></div><div class="eseal">${wax(58, 'e')}</div></div></button><p class="tap">Tap the envelope to open</p></div>`;
    $('b').onclick = () => { $('g').classList.remove('pulse'); $('g').classList.add('open'); setTimeout(go, 2200); };
  },
  book(c) {
    c.innerHTML = `<div><p class="for">${FOR}</p><button class="cbtn" id="b" aria-label="Open the book"><div class="bk pulse" id="g"><div class="pg"><b>${esc(heading)}</b><span>${esc(C.dateText)}</span></div><div class="cv"><b>${esc(heading)}</b><i>${esc(C.eventLabel)}</i></div></div></button><p class="tap">Tap the book to open</p></div>`;
    $('b').onclick = () => { $('g').classList.remove('pulse'); $('g').classList.add('open'); setTimeout(go, 2600); };
  },
  cinematic(c) {
    c.style.background = '#0a0a0a'; c.style.color = '#fff';
    c.innerHTML = `<div class="bar t"></div><div class="bar b"></div><div id="in"><button class="cbtn openbtn" id="b" aria-label="Play the invitation">Play</button></div>`;
    $('b').onclick = () => {
      c.classList.add('cin-on');
      $('in').innerHTML = `<div class="cin"><p style="--d:.6s">${esc(C.intro)}</p><h1 style="--d:1.6s;font-family:var(--disp,var(--serif))">${esc(heading)}</h1><p style="--d:3s">${esc(C.dateText)}</p></div>`;
      setTimeout(go, 5600);
    };
  },
  gift(c) {
    c.innerHTML = `<div><p class="for">${FOR}</p><button class="cbtn" id="b" aria-label="Open the gift"><div class="gift pulse" id="g"><div class="lid"></div><div class="bx"></div></div></button><p class="tap">Tap the gift to open</p></div>`;
    $('b').onclick = () => { $('g').classList.remove('pulse'); $('g').classList.add('pop'); confetti(); setTimeout(go, 1500); };
  },
  balloon(c) {
    c.innerHTML = `<div><p class="for">${FOR}</p><button class="cbtn" id="b" aria-label="Pop the balloon"><div class="bl" id="g"><i></i></div></button><p class="tap">Tap the balloon to pop it</p></div>`;
    $('b').onclick = () => { $('g').classList.add('pop'); confetti(); setTimeout(go, 1100); };
  },
  polaroid(c) {
    if (C.heroPhoto) c.style.setProperty('--pic', `url("${C.heroPhoto}")`);
    c.innerHTML = `<div><p class="for">${FOR}</p><button class="cbtn" id="b" aria-label="Develop the photo"><div class="pz pulse" id="g"><div class="ph"></div><p>${esc(heading)}</p></div></button><p class="tap">Tap the photo to develop it</p></div>`;
    $('b').onclick = () => { const g = $('g'); g.classList.remove('pulse'); g.classList.add('dev'); setTimeout(() => g.classList.add('away'), 2600); setTimeout(go, 3300); };
  },
  passport(c) {
    c.innerHTML = `<div><p class="for">${FOR}</p><button class="cbtn" id="b" aria-label="Open the passport invitation"><div class="passport-card" id="passportCard"><div class="passport-emblem">✦</div><div class="passport-label">Wedding passport</div><div class="passport-label">The journey of</div><div class="passport-names">${esc(heading)}</div><div class="passport-label">${esc(C.dateText)}</div><div class="passport-stamp">ADMIT<br>ONE HEART<br>FOREVER</div></div></button><p class="tap">Tap your passport to begin the journey</p></div>`;
    $('b').onclick = () => { $('passportCard').classList.add('opening'); setTimeout(go, 1250); };
  },
  scratch(c) {
    c.innerHTML = `<div><p class="for">${FOR}</p><div class="sc"><div class="under"><b>${esc(heading)}</b><span>${esc(C.dateText)}</span></div><canvas id="cv" width="300" height="180"></canvas></div><p class="tap">Scratch to reveal</p></div>`;
    const cv = $('cv'), x = cv.getContext('2d'), g = x.createLinearGradient(0, 0, 300, 180);
    g.addColorStop(0, '#d9b868'); g.addColorStop(.5, '#f4e2a6'); g.addColorStop(1, '#b8923f');
    x.fillStyle = g; x.fillRect(0, 0, 300, 180); x.fillStyle = '#7a5d1e'; x.font = '600 22px sans-serif'; x.textAlign = 'center'; x.fillText('Scratch here', 150, 96);
    let down = false, n = 0, done = false;
    const at = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * 300 / r.width, (e.clientY - r.top) * 180 / r.height]; };
    cv.onpointerdown = e => { down = true; cv.setPointerCapture(e.pointerId); };
    cv.onpointerup = () => down = false;
    cv.onpointermove = e => {
      if (!down || done) return;
      const [px, py] = at(e); x.globalCompositeOperation = 'destination-out'; x.beginPath(); x.arc(px, py, 22, 0, 7); x.fill();
      if (++n % 8) return;
      const d = x.getImageData(0, 0, 300, 180).data; let k = 0;
      for (let i = 3; i < d.length; i += 64) if (d[i] === 0) k++;
      if (k / (d.length / 64) > .45) { done = true; cv.style.opacity = 0; setTimeout(go, 1300); }
    };
  }
};
const SITE = C.siteId || location.hostname, code = new URLSearchParams(location.search).get('g') || '';
let G = null, seats = C.maxGuests, count = 1;
(async () => {
  if (code && C.rsvpEndpoint) {
    try {
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 4000);
      const r = await fetch(`${C.rsvpEndpoint}?action=guest&site=${encodeURIComponent(SITE)}&g=${encodeURIComponent(code)}`, { signal: ctl.signal });
      clearTimeout(tm); const j = await r.json(); if (j.found) G = j;
    } catch (e) {}
  }
  if (G) {
    FOR = `Especially for ${esc(G.name)}`; seats = G.seats; $('name').value = G.name; $('name').readOnly = true;
    T('rsvpNote', `Please reply by ${C.rsvpDeadline}.`);
    $('badge').style.display = ''; $('badge').textContent = `We have reserved ${G.seats} ${G.seats > 1 ? 'seats' : 'seat'} for you.`;
  }
  renderPeople();
  (OPEN[C.opening] || OPEN.doors)($('cover'));
})();

// Countdown and calendar
function tick() {
  let s = Math.max(0, Math.floor((date - Date.now()) / 1000));
  $('count').innerHTML = [['Days', 86400], ['Hours', 3600], ['Minutes', 60], ['Seconds', 1]].map(([l, n]) => { const v = Math.floor(s / n); s -= v * n; return `<div><b>${v}</b><span>${l}</span></div>`; }).join('');
}
tick(); setInterval(tick, 1000);
$('cal').addEventListener('click', e => {
  e.preventDefault();
  const f = d => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z', end = new Date(date.getTime() + 5 * 3600 * 1000);
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'BEGIN:VEVENT', `DTSTART:${f(date)}`, `DTEND:${f(end)}`, `SUMMARY:${heading} ${C.eventLabel}`, `LOCATION:${C.venueName}, ${C.venueAddress}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a.download = 'event.ics'; a.click();
});

// RSVP
const yes = () => document.querySelector('[name=attending]:checked').value === 'yes';
function renderPeople() {
  const prev = [...document.querySelectorAll('#people .pr')].map(r => ({ n: (r.querySelector('.pn') || {}).value || '', m: (r.querySelector('.pm') || {}).value || '' }));
  $('cnt').textContent = count; $('seatNote').textContent = seats > 1 ? (G ? `${seats} seats reserved` : `up to ${seats}`) : '';
  $('cntBox').style.display = seats > 1 ? '' : 'none';
  const need = meals.length || (count > 1 && C.rsvpGuestNames !== false);
  $('people').style.display = need ? '' : 'none';
  $('people').innerHTML = need ? '<span class="lab">Guests' + (meals.length ? ' and meal choices' : '') + '</span>' + Array.from({ length: count }, (_, i) =>
    `<div class="pr"><span class="pi">${i + 1}</span>` + (i === 0 ? `<span class="who" id="who1">${esc($('name').value || 'You')}</span>` : `<input class="pn" placeholder="Guest name" value="${esc((prev[i] || {}).n || '')}" aria-label="Guest ${i + 1} name">`)
    + (meals.length ? `<select class="pm" aria-label="Meal choice ${i + 1}">${meals.map(m => `<option${(prev[i] || {}).m === m ? ' selected' : ''}>${esc(m)}</option>`).join('')}</select>` : '') + '</div>').join('') : '';
}
$('minus').onclick = () => { if (count > 1) { count--; renderPeople(); } };
$('plus').onclick = () => { if (count < seats) { count++; renderPeople(); } };
$('name').addEventListener('input', () => { const w = $('who1'); if (w) w.textContent = $('name').value || 'You'; });
document.querySelectorAll('[name=attending]').forEach(r => r.addEventListener('change', () => { $('more').style.display = yes() ? '' : 'none'; }));
const KEY = 'rsvp_' + SITE + '_' + (code || 'open');
try { const old = JSON.parse(localStorage.getItem(KEY) || 'null'); if (old) { $('badge').style.display = ''; $('badge').textContent = `You replied ${old.attending === 'yes' ? 'YES' : 'NO'} on ${new Date(old.at).toLocaleDateString('en-AU', { day: 'numeric', month: 'long' })}. You can update your reply below.`; } } catch (e) {}
$('form').addEventListener('submit', async e => {
  e.preventDefault(); $('err').textContent = '';
  const name = $('name').value.trim(), email = $('email').value.trim(), att = yes();
  if (!name) return $('err').textContent = 'Please enter your name.';
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return $('err').textContent = 'Please enter a valid email so we can send your confirmation.';
  const rows = [...document.querySelectorAll('#people .pr')];
  const attendees = att ? rows.map((r, i) => ({ name: i === 0 ? name : (r.querySelector('.pn') || {}).value.trim(), meal: (r.querySelector('.pm') || {}).value || '' })) : [];
  if (att && attendees.some(a => !a.name)) return $('err').textContent = 'Please enter the name of each guest.';
  const data = { name, email, phone: $('phone').value.trim(), website: $('website').value, attending: att ? 'yes' : 'no', guests: att ? count : 0, attendees, dietary: $('diet').value.trim(), song: $('song').value.trim(), message: $('msg').value.trim(),
    code, site: SITE, sentAt: new Date().toISOString(), pageUrl: location.origin + location.pathname, title: `${heading} ${C.eventLabel}`, dateText: C.dateText, timeText: C.timeText,
    venueName: C.venueName, venueAddress: C.venueAddress, notifyEmail: C.notifyEmail, senderName: C.senderName, emailNote: C.emailNote };
  const btn = $('submitBtn'); btn.disabled = true; btn.textContent = 'Sending...';
  try {
    if (C.rsvpEndpoint) await fetch(C.rsvpEndpoint, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) });
    else console.log('RSVP (not connected yet):', data);
  } catch (err) { btn.disabled = false; btn.textContent = L.submit; return $('err').textContent = 'We could not send your reply. Please check your connection and try again.'; }
  try { localStorage.setItem(KEY, JSON.stringify({ at: Date.now(), attending: data.attending })); } catch (e) {}
  const sum = [['Name', name], ['Reply', att ? L.yes : L.no]];
  if (att) { sum.push(['Attending', count + (count > 1 ? ' guests' : ' guest')]); attendees.forEach((a, i) => sum.push([i ? 'Guest ' + (i + 1) : 'Guest 1', a.name + (a.meal ? ' · ' + a.meal : '')])); if (data.dietary) sum.push(['Dietary', data.dietary]); }
  $('form').style.display = 'none'; const th = $('thanks'); th.style.display = 'block';
  th.innerHTML = `<h3>${att ? 'Thank you, ' + esc(name.split(' ')[0]) : 'Thank you for letting us know'}</h3><p>${att ? 'Your reply is in. We cannot wait to celebrate with you.' : 'We will miss you.'}${C.rsvpEndpoint ? ' A copy is on its way to ' + esc(email) + '.' : ''}</p><div class="sum">${sum.map(r => `<div><span>${esc(r[0])}</span><b style="font-weight:400">${esc(r[1])}</b></div>`).join('')}</div><button class="btn alt" type="button" id="edit">Change my reply</button>`;
  $('edit').onclick = () => { th.style.display = 'none'; $('form').style.display = ''; btn.disabled = false; btn.textContent = L.submit; };
  th.scrollIntoView({ behavior: 'smooth', block: 'center' });
});
</script>
</body>
